name: TypeScript and Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript 與 Vitest
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 pnpm
        uses: pnpm/action-setup@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安裝專案依賴套件
        run: pnpm install --frozen-lockfile

      - name: TypeScript 檢查
        run: pnpm check

      - name: Vitest 回歸測試
        run: pnpm test
