name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 釋放 GitHub Runner 磁碟空間與設定權限
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 啟用 pnpm
        run: corepack enable

      - name: 設定 Java 環境
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安裝專案依賴套件
        run: pnpm install --frozen-lockfile

      - name: 驗證 TypeScript 與核心回歸測試
        run: |
          pnpm check
          pnpm test

      - name: 自動更新版本與建置識別碼
        run: node scripts/update-build-version.mjs

      - name: 清除 APK 建置前快取與暫存產物
        run: pnpm run clean:release

      - name: 產生 Android 原生專案結構
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: 使用 Gradle 進行 Android Debug APK 編譯
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --warning-mode=all \
            -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options=-Xmx512m

      - name: 重新命名 APK 檔名與設定 Step Outputs
        id: rename_apk
        if: success()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="update"
          fi
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1 | tr -cd '[:alnum:]_- ' | tr ' ' '_')
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          mkdir -p dist-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            NEW_NAME="baseball-scorer-${FIRST_LINE}-${TIMESTAMP}.apk"
            cp "$APK_PATH" "dist-apk/$NEW_NAME"
            echo "RENAMED_APK=dist-apk/$NEW_NAME" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=Android-Debug-APK-${FIRST_LINE}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          else
            echo "RENAMED_APK=" >> $GITHUB_OUTPUT
            echo "ARTIFACT_NAME=Android-Debug-APK-${TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      - name: 儲存 Debug APK 檔案供下載
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.ARTIFACT_NAME || 'Android-Debug-APK' }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ${{ steps.rename_apk.outputs.RENAMED_APK }}
